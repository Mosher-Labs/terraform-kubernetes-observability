---
name: Terraform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  terraform:
    uses: "Mosher-Labs/.github/.github/workflows/terraform-module.yml@eca74fb101c36bf9a69a17b4556184f079762ef8"  # v0.12.3
    permissions:
      contents: read
    with:
      # The oldest version the module supports (required_version) and the
      # newest we use. The tests mock the Grafana provider, so they need no
      # Grafana and no credentials.
      terraform_versions: '["1.15.8", "1.16.4"]'
      # modules/datadog needs the Datadog provider, which the root doesn't
      # require, so its tests run from its own directory, with the provider
      # mocked.
      test_directories: '["modules/datadog"]'
