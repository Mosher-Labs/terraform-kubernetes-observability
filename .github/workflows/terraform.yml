---
name: Terraform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  terraform:
    uses: "Mosher-Labs/.github/.github/workflows/terraform-module.yml@1c9333e19f2a9c8cd324288bab3f184819fffa6b"  # v0.11.0
    permissions:
      contents: read
    with:
      # The oldest version the module supports (required_version) and the
      # newest we use. The tests mock the Grafana provider, so they need no
      # Grafana and no credentials.
      terraform_versions: '["1.15.8", "1.16.4"]'
