---
name: Terraform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  test:
    name: validate and test (${{ matrix.terraform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the module supports (required_version) and the
        # newest we use.
        terraform:
          - 1.15.8
          - 1.16.4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Validate the module
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate the examples
        run: |
          for dir in examples/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      # The tests mock the Grafana provider, so they need no Grafana and no
      # credentials.
      - name: Test
        run: terraform test
