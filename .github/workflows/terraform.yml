---
name: Terraform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  terraform:
    uses: "Mosher-Labs/.github/.github/workflows/terraform-module.yml@cbe04ae6af70d804f7e1a177b237fe4dd85e46be"  # feat/terraform-module-workflow (test; re-pin to the release)
    permissions:
      contents: read
    with:
      # The oldest version the module supports (required_version) and the
      # newest we use. The tests mock the Grafana provider, so they need no
      # Grafana and no credentials.
      terraform_versions: '["1.15.8", "1.16.4"]'
