---
name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  # Cuts a semver release from the conventional commit history on main.
  release:
    # Fork PRs get a read-only token, so the release job's PR comment would fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: "Mosher-Labs/.github/.github/workflows/release.yml@5c525704f2a00d0541a59d53a78662a980a4a130"  # v0.12.1
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets: inherit
