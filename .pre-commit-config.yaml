---
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/terraform-docs/terraform-docs
    rev: 9d4455198941806aa02ec14369de030cda2c2b59  # frozen: v0.24.0
    hooks:
      - id: terraform-docs-go
        args: [.]
  # The upstream Docker hooks pull their images by tag, so run the same images
  # as local hooks pinned by digest.
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        language: docker_image
        files: \.(tf|tftest\.hcl)$
        entry: docker.io/hashicorp/terraform:1.16.6@sha256:bfffc1ded5fbf0a17beaaf22eb4793980abdb19d0761ff6a3a0efb2ab4d9b316 fmt
      - id: tflint
        name: tflint
        language: docker_image
        types: [terraform]
        pass_filenames: false
        entry: ghcr.io/terraform-linters/tflint:v0.65.0@sha256:2788f4d4fc663c0e953b011b01bf443fe5bfce7587ee916e588e6057b85d6359 --recursive --config=/src/.tflint.hcl
      - id: markdownlint-docker
        name: markdownlint
        language: docker_image
        types: [markdown]
        entry: ghcr.io/igorshubovych/markdownlint-cli:v0.50.0@sha256:db7dcb73cd3163cc45854b60fc21eefe1ebe7fa52aad758706010b64a4778900
      - id: actionlint-docker
        name: Lint GitHub Actions workflow files
        language: docker_image
        types: [yaml]
        files: ^\.github/workflows/
        entry: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  # Keeps the revs above current and frozen to commit SHAs. Checks at most once
  # a day, and only takes releases that are at least a week old.
  - repo: https://github.com/mosher-labs/pre-commit-autoupdate
    rev: 3be8bbd6c69bcf775d15ec32213b779b82bfacb3  # frozen: v1.2.11
    hooks:
      - id: autoupdate
        args: [--freeze, --interval-hours, "24", --min-age-days, "7"]
